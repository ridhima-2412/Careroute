apiVersion: apps/v1
kind: Deployment
metadata:
  name: careroute-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: careroute-backend
  template:
    metadata:
      labels:
        app: careroute-backend
    spec:
      containers:
        - name: careroute-backend
          image: careroute-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000